              </div>

              ${v.video_id ? `
                <div id="${playerId}" class="video-player-wrapper">
                  <div class="video-thumb-cover" style="background-image: url('https://img.youtube.com/vi/${v.video_id}/hqdefault.jpg');" onclick="playVideo('${v.video_id}', '${safeTitle}')">
                    <div class="video-play-btn-overlay" title="Play Video">
                      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                  </div>
                </div>
              ` : ''}

              ${v.summary_html ? `<div class="summary-content">${v.summary_html}</div>` : ''}
            </div>
          `;
        });

        let notebookLinkBtn = ch.notebook_url ? `
          <a href="${ch.notebook_url}" target="_blank" class="btn-primary">
            <span>Notebook ↗</span>
          </a>
        ` : '';

        pane.innerHTML = `
          <article class="max-w-4xl mx-auto space-y-6">
            ${mobileBackNav}
            <div class="border-b border-[var(--border-color)] pb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h1 class="text-2xl font-bold tracking-tight text-[var(--text-primary)]">${esc(ch.name)}</h1>
                <div class="flex items-center gap-2 mt-1 text-xs text-[var(--text-muted)]">
                  <span>${weekData.run_date}</span>
                  <span>·</span>
                  <span>${ch.videos ? ch.videos.length : 0} videos</span>
                  ${ch.subscribers ? `<span>·</span><span>${esc(ch.subscribers)}</span>` : ''}
                </div>
              </div>

              <div class="flex items-center gap-2 flex-shrink-0">
                ${ch.summary_audio_url ? `<button onclick="playSummaryAudio('${ch.id}')" class="btn-secondary text-xs" title="Listen to spoken summary">🔊 Listen to Summary</button>` : ''}
                <button onclick="toggleRead('${ch.id}')" class="btn-secondary" data-role="read-toggle">
                  <span>${isRead ? 'Mark as Unread' : 'Mark as Read ✓'}</span>
                </button>
                ${notebookLinkBtn}
              </div>
            </div>

            <!-- Conditional Audio Overview Player -->
            ${audioSection}

            <!-- Video Cards (No duplicate summary block!) -->
            <div class="space-y-4">
              ${videosHtml || `<div class="text-sm text-[var(--text-muted)] py-6">No individual video entries for this digest.</div>`}
            </div>
          </article>
        `;
      }
    }

    // Shared format helpers
    function fmtClock(secs) {
      const s = Math.max(0, Math.floor(Number(secs) || 0));
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }
    function fmtAudioDur(sec) {
      const s = Math.max(0, Math.round(Number(sec) || 0));
      const h = Math.floor(s / 3600);
      const m = Math.round((s % 3600) / 60);
      return h > 0 ? `${h} h ${m}` : `${m} min`;
    }

    // Heard store (audio tracks listened to 90%+)
    function heardKey(src) { return 'tubelm_heard:' + src; }
    function isHeard(src) {
      if (!src) return false;
      try { return localStorage.getItem(heardKey(src)) === '1'; } catch (_) { return false; }
    }
    function markHeard(src) {
      if (!src || isHeard(src)) return;
      try { localStorage.setItem(heardKey(src), '1'); } catch (_) {}
      renderSidebar();
    }

    // Top-20 seen store
    let top20Read = new Set();
    try { top20Read = new Set(JSON.parse(localStorage.getItem('tubelm_top20_read') || '[]')); }
    catch (_) { top20Read = new Set(); }
    let hideSeen = false;
    try { hideSeen = localStorage.getItem('tubelm_hide_seen') === '1'; } catch (_) {}
    function saveTop20Read() {
      try { localStorage.setItem('tubelm_top20_read', JSON.stringify(Array.from(top20Read))); } catch (_) {}
    }
    function topItemKey(item) { return item.video_id || item.url; }
    function isTopItemRead(id) { return top20Read.has(id); }
    function markTopSeen(id) {
      if (!id || top20Read.has(id)) return;
      top20Read.add(id);
      saveTop20Read();
    }
    function toggleTopItemRead(id) {
      if (top20Read.has(id)) top20Read.delete(id); else top20Read.add(id);
      saveTop20Read();
      if (selectedItemId === 'top20' && !briefMode) renderActiveView();
    }
    function toggleHideSeen() {
      hideSeen = !hideSeen;
      try { localStorage.setItem('tubelm_hide_seen', hideSeen ? '1' : '0'); } catch (_) {}
      renderActiveView();
    }

    // Brief mode
    let briefMode = false;
    try { briefMode = localStorage.getItem('tubelm_mode') === 'brief'; } catch (_) {}
    function setBriefMode(on) {
      briefMode = !!on;
      try { localStorage.setItem('tubelm_mode', briefMode ? 'brief' : 'full'); } catch (_) {}
      updateBriefButton();
      renderActiveView();
    }
    function toggleBriefMode() { setBriefMode(!briefMode); }
    function updateBriefButton() {
      const btn = document.getElementById('mode-brief');
      if (btn) btn.classList.toggle('active-mode', briefMode);
    }
    function renderBriefView(weekData, mobileBackNav) {
      const list = filteredChannels().filter(ch => !isChannelRead(ch.id));
      let sections = '';
      list.forEach(ch => {
        const items = (ch.brief && ch.brief.length)
          ? ch.brief
          : (ch.videos || []).map(v => ({ title: v.title, url: v.url, video_id: v.video_id, lead: v.lead || '' }));
        let itemsHtml = '';
        items.forEach((b, bi) => {
          itemsHtml += `
            <div class="mt-3">
              <a href="${b.url}" target="_blank" style="font-size:14px;font-weight:600">${esc(b.title)}</a>
              ${b.lead ? `<p class="brief-lead">${esc(b.lead)}</p>` : ''}
              <button onclick="toggleBriefItem('${ch.id}', ${bi})" class="btn-seen mt-1" id="brief-btn-${ch.id}-${bi}">Read full ↓</button>
              <div id="brief-full-${ch.id}-${bi}" class="brief-full hidden"></div>
            </div>`;
        });
        const audioBit = (ch.has_audio && ch.audio_seconds) ? ` · ${Math.max(1, Math.round(ch.audio_seconds / 60))}m audio` : '';
        sections += `
          <section class="brief-section">
            <button onclick="selectChannel('${ch.id}')" style="background:none;border:none;cursor:pointer;font-size:15px;font-weight:700;text-align:left;color:var(--text-primary);padding:0">${esc(ch.name)}</button>
            <div class="text-xs text-[var(--text-muted)] mt-1">~${ch.read_minutes || 1} min${audioBit}
              ${ch.summary_audio_url ? `<button onclick="playSummaryAudio('${ch.id}')" class="btn-seen" title="Listen to spoken summary">🔊 Listen</button>` : ''}
            </div>
            ${itemsHtml}
          </section>`;
      });
      return `
        <article id="briefView" class="max-w-4xl mx-auto space-y-4">
          ${mobileBackNav}
          <div class="border-b border-[var(--border-color)] pb-4">
            <h1 class="text-2xl font-bold tracking-tight text-[var(--text-primary)]">5-Minute Brief</h1>
            <div class="text-xs text-[var(--text-muted)] mt-1">${list.length} unread channel${list.length === 1 ? '' : 's'}</div>
          </div>
          ${sections || `<div class="text-sm text-[var(--text-muted)] py-6">All caught up. ✓</div>`}
          ${list.length ? `<div class="brief-sticky"><button onclick="markBriefAllRead()" class="btn-primary w-full">Mark all above as read</button></div>` : ''}
        </article>`;
    }
    function toggleBriefItem(chId, bi) {
      const weekData = SITE_DATA.weeks[currentWeekKey] || { channels: [] };
      const ch = (weekData.channels || []).find(c => c.id === chId);
      const box = document.getElementById(`brief-full-${chId}-${bi}`);
      const btn = document.getElementById(`brief-btn-${chId}-${bi}`);
      if (!box || !ch) return;
      if (box.classList.contains('hidden')) {
        if (!box.dataset.filled) {
          const items = (ch.brief && ch.brief.length) ? ch.brief : [];
          const b = items[bi] || {};
          const full = (ch.videos || []).find(v => v.url && b.url && v.url === b.url);
          box.innerHTML = `<div class="summary-content">${(full && full.summary_html) || ''}</div>`;
          box.dataset.filled = '1';
        }
        box.classList.remove('hidden');
        if (btn) btn.textContent = 'Show less ↑';
      } else {
        box.classList.add('hidden');
        if (btn) btn.textContent = 'Read full ↓';
      }
    }
    function markBriefAllRead() {
      filteredChannels().forEach(ch => { if (!isChannelRead(ch.id)) toggleRead(ch.id); });
      renderSidebar();
      renderActiveView();
    }

    // Video player preference + unified dispatcher
    function isMobileDevice() { return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent || ''); }
    function playerPref() {
      try {
        const p = localStorage.getItem('tubelm_player_pref');
        if (p === 'app' || p === 'inline') return p;
      } catch (_) {}
      return isMobileDevice() ? 'app' : 'inline';
    }
    function setPlayerPref(p) {
      try { localStorage.setItem('tubelm_player_pref', p); } catch (_) {}
      updatePlayerPrefChips();
    }
    function togglePlayerPref() { setPlayerPref(playerPref() === 'app' ? 'inline' : 'app'); }
    function prefChipHtml() {
      return '';
    }
    function updatePlayerPrefChips() {
      try { document.documentElement.setAttribute('data-player-pref', playerPref()); } catch (_) {}
    }
    function playVideo(videoId, title, opts) {
      opts = opts || {};
      try { markTopSeen(videoId); } catch (_) {}
      if (isAudioPlaying && globalAudio && !globalAudio.paused) {
        globalAudio.pause();
        isAudioPlaying = false;
        updatePlayIcon();
        updateMiniPlayer();
      }
      const pref = opts.preferInline ? 'inline' : playerPref();
      if (pref === 'app' && isMobileDevice() && videoId) {
        let appOpened = false;
        const onDeactivate = () => {
          appOpened = true;
          window.removeEventListener('pagehide', onDeactivate);
          window.removeEventListener('blur', onDeactivate);
        };
        window.addEventListener('pagehide', onDeactivate);
        window.addEventListener('blur', onDeactivate);
        window.location.href = 'youtube://watch?v=' + encodeURIComponent(videoId);
        setTimeout(() => {
          window.removeEventListener('pagehide', onDeactivate);
          window.removeEventListener('blur', onDeactivate);
          if (!appOpened && document.visibilityState === 'visible') openVideoModal(videoId, title);
        }, 600);
        return;
      }
      openVideoModal(videoId, title);
    }

    // Playlist queue + mini-player
    const CATEGORY_ORDER = ['tech', 'deep_explainer', 'health', 'news_feed'];
    const PLAYER_SPEEDS = [1.0, 1.25, 1.5, 1.75, 2.0];
    const player = { queue: [], index: -1, speed: 1.0 };
    function savePlayer() {
      try {
        localStorage.setItem('tubelm_player', JSON.stringify({ queue: player.queue, index: player.index, speed: player.speed }));
      } catch (_) {}
    }
    function loadPlayer() {
      try {
        const raw = JSON.parse(localStorage.getItem('tubelm_player') || 'null');
        if (raw && Array.isArray(raw.queue)) {
          player.queue = raw.queue.filter(t => t && t.src);
          player.index = Number(raw.index);
          if (!(player.index >= 0 && player.index < player.queue.length)) player.index = player.queue.length ? 0 : -1;
          if (PLAYER_SPEEDS.includes(Number(raw.speed))) player.speed = Number(raw.speed);
        }
      } catch (_) {}
      if (!player.queue.length) player.index = -1;
      try { globalAudio.playbackRate = player.speed || 1.0; } catch (_) {}
    }
    function findChannel(weekKey, chId) {
      const wData = SITE_DATA.weeks[weekKey] || {};
      return ((wData.channels || []).find(c => c.id === chId)) || null;
    }
    function buildQueue(weekKey, opts) {
      const unheardOnly = !opts || opts.unheardOnly !== false;
      const weekData = SITE_DATA.weeks[weekKey || currentWeekKey] || { channels: [] };
      const list = (weekData.channels || []).map(ch => {
        const src = ch.audio_url || ch.summary_audio_url;
        const isSummary = !ch.audio_url && !!ch.summary_audio_url;
        return { ch, src, isSummary };
      }).filter(item =>
        item.src &&
        (currentCategoryId === 'all' || item.ch.category === currentCategoryId) &&
        (!unheardOnly || !isHeard(item.src))
      );
      list.sort((a, b) => {
        const ca = CATEGORY_ORDER.indexOf(a.ch.category);
        const cb = CATEGORY_ORDER.indexOf(b.ch.category);
        const ra = ca < 0 ? 99 : ca;
        const rb = cb < 0 ? 99 : cb;
        if (ra !== rb) return ra - rb;
        return String(a.ch.name || '').localeCompare(String(b.ch.name || ''));
      });
      player.queue = list.map(item => ({
        chId: item.ch.id,
        weekKey: weekKey || currentWeekKey,
        src: item.src,
        title: item.ch.name + (item.isSummary ? ' (Summary)' : ''),
        category: item.ch.category,
        summary: item.isSummary,
      }));
      player.index = -1;
      savePlayer();
      updateMiniPlayer();
    }
    function playIndex(i) {
      if (i < 0 || i >= player.queue.length) return;
      player.index = i;
      const t = player.queue[i];
      currentAudioSrc = t.src;
      savePlayer();
      try { globalAudio.playbackRate = player.speed || 1.0; } catch (_) {}
      let started = false;
      const begin = () => {
        globalAudio.play().then(() => { started = true; setMediaSessionMeta(); }).catch(() => {});
      };
      globalAudio.addEventListener('loadedmetadata', function once() {
        globalAudio.removeEventListener('loadedmetadata', once);
        try {
          const saved = parseFloat(localStorage.getItem('tubelm_pos:' + t.src) || '0');
          if (saved > 0 && saved < (globalAudio.duration || Infinity)) globalAudio.currentTime = saved;
        } catch (_) {}
        updatePositionState();
        if (!started) begin();
      });
      globalAudio.src = t.src;
      begin();
      isAudioPlaying = true;
      updatePlayIcon();
      updateMiniPlayer();
    }
    function queueNext() {
      let i = player.index + 1;
      while (i < player.queue.length && isHeard(player.queue[i].src)) i++;
      if (i >= player.queue.length) {
        isAudioPlaying = false;
        try { if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused'; } catch (_) {}
        updatePlayIcon();
        updateMiniPlayer();
        return;
      }
      playIndex(i);
    }
    function queuePrev() {
      if (player.index > 0) playIndex(player.index - 1);
    }
    function playAllUnheard() {
      buildQueue(currentWeekKey, { unheardOnly: true });
      if (!player.queue.length) {
        buildQueue(currentWeekKey, { unheardOnly: false });
      }
      if (!player.queue.length) return;
      playIndex(0);
    }
    function playChannelAudio(chId) {
      const weekData = SITE_DATA.weeks[currentWeekKey] || { channels: [] };
      const ch = (weekData.channels || []).find(c => c.id === chId);
      if (!ch || !ch.audio_url) return;
      const idx = player.queue.findIndex(t => t.src === ch.audio_url);
      if (idx >= 0 && idx === player.index) {
        if (globalAudio.paused) {
          globalAudio.play().catch(() => {});
          isAudioPlaying = true;
        } else {
          globalAudio.pause();
          isAudioPlaying = false;
        }
        updatePlayIcon();
        updateMiniPlayer();
        return;
      }
      if (idx >= 0) { playIndex(idx); return; }
      player.queue.splice(player.index + 1, 0,
        { chId: ch.id, weekKey: currentWeekKey, src: ch.audio_url, title: ch.name, category: ch.category });
      playIndex(player.index + 1);
    }
    function enqueueChannel(chId) {
      const weekData = SITE_DATA.weeks[currentWeekKey] || { channels: [] };
      const ch = (weekData.channels || []).find(c => c.id === chId);
      if (!ch || !ch.audio_url) return;
      if (!player.queue.some(t => t.src === ch.audio_url)) {
        player.queue.push({ chId: ch.id, weekKey: currentWeekKey, src: ch.audio_url, title: ch.name, category: ch.category });
        savePlayer();
      }
      updateMiniPlayer();
    }
    function openMiniTrack() {
      const t = player.queue[player.index];
      if (!t) return;
      if (t.weekKey && t.weekKey !== currentWeekKey && SITE_DATA.weeks[t.weekKey]) switchWeek(t.weekKey);
      selectChannel(t.chId);
    }
    function playSummaryAudio(chId) {
      const weekData = SITE_DATA.weeks[currentWeekKey] || { channels: [] };
      const ch = (weekData.channels || []).find(c => c.id === chId);
      if (!ch || !ch.summary_audio_url) return;
      const idx = player.queue.findIndex(t => t.src === ch.summary_audio_url);
      if (idx >= 0 && idx === player.index) {
        if (globalAudio.paused) {
          globalAudio.play().catch(() => {});
          isAudioPlaying = true;
        } else {
          globalAudio.pause();
          isAudioPlaying = false;
        }
        updatePlayIcon();
        updateMiniPlayer();
        return;
      }
      if (idx >= 0) { playIndex(idx); return; }
      player.queue.splice(player.index + 1, 0,
        { chId: ch.id, weekKey: currentWeekKey, src: ch.summary_audio_url,
          title: ch.name + ' (Summary)', category: ch.category, summary: true });
      playIndex(player.index + 1);
    }
    function toggleMiniPlay() {
      if (!player.queue.length || player.index < 0) return;
      const t = player.queue[player.index];
      if (globalAudio.paused) {
        if (currentAudioSrc !== t.src) { playIndex(player.index); return; }
        globalAudio.play().catch(() => {});
        isAudioPlaying = true;
      } else {
        globalAudio.pause();
        isAudioPlaying = false;
      }
      updatePlayIcon();
      updateMiniPlayer();
    }
    function cyclePlayerSpeed() {
      const cur = player.speed || 1.0;
      player.speed = PLAYER_SPEEDS[(PLAYER_SPEEDS.indexOf(cur) + 1) % PLAYER_SPEEDS.length];
      try { globalAudio.playbackRate = player.speed; } catch (_) {}
      savePlayer();
      updateMiniPlayer();
      updatePositionState();
    }
    function updateMiniPlayer() {
      const bar = document.getElementById('miniPlayer');
      if (!bar) return;
      const hasQueue = player.queue.length > 0 && player.index >= 0 && !!player.queue[player.index];
      bar.classList.toggle('hidden', !hasQueue);
      document.body.classList.toggle('mini-visible', hasQueue);
      try {
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = isAudioPlaying ? 'playing' : 'paused';
      } catch (_) {}
      if (!hasQueue) return;
      const t = player.queue[player.index];
      const ch = findChannel(t.weekKey, t.chId) || {};
      const titleEl = document.getElementById('mini-title');
      const subEl = document.getElementById('mini-sub');
      const playEl = document.getElementById('mini-play');
      const speedEl = document.getElementById('mini-speed');
      const progEl = document.getElementById('mini-progress');
      if (titleEl) titleEl.textContent = ch.name || t.title || 'TubeLM';
      const sameSrc = currentAudioSrc === t.src;
      let cur = 0;
      let dur = 0;
      try {
        if (sameSrc && isFinite(globalAudio.currentTime)) cur = globalAudio.currentTime;
        else cur = parseFloat(localStorage.getItem('tubelm_pos:' + t.src) || '0') || 0;
        if (sameSrc && isFinite(globalAudio.duration) && globalAudio.duration) dur = globalAudio.duration;
      } catch (_) {}
      if (subEl) subEl.textContent = `${ch.category || t.category || ''} · ${fmtClock(cur)} / ${dur ? fmtClock(dur) : '--:--'}`;
      if (playEl) playEl.textContent = (isAudioPlaying && !globalAudio.paused) ? '⏸' : '⏯';
      if (speedEl) speedEl.textContent = `${player.speed || 1.0}x`;
      if (progEl) progEl.style.width = dur > 0 ? `${(cur / dur) * 100}%` : '0%';
    }

    // MediaSession integration
    function setupMediaSessionHandlers() {
      if (!('mediaSession' in navigator)) return;
      const wrap = (action, fn) => { try { navigator.mediaSession.setActionHandler(action, fn); } catch (_) {} };
      wrap('play', () => toggleMiniPlay());
      wrap('pause', () => { if (!globalAudio.paused) toggleMiniPlay(); });
      wrap('previoustrack', () => queuePrev());
      wrap('nexttrack', () => queueNext());
      wrap('seekbackward', (d) => {
        const off = (d && d.seekOffset) || 15;
        try { globalAudio.currentTime = Math.max(0, globalAudio.currentTime - off); } catch (_) {}
      });
      wrap('seekforward', (d) => {
        const off = (d && d.seekOffset) || 30;
        try { globalAudio.currentTime = Math.min(globalAudio.duration || Infinity, globalAudio.currentTime + off); } catch (_) {}
      });
      wrap('seekto', (d) => {
        if (!d || typeof d.seekTime !== 'number') return;
        try {
          if (d.fastSeek && globalAudio.fastSeek) globalAudio.fastSeek(d.seekTime);
          else globalAudio.currentTime = d.seekTime;
        } catch (_) {}
      });
      wrap('stop', () => {
        try { globalAudio.pause(); } catch (_) {}
        isAudioPlaying = false;
        updatePlayIcon();
        updateMiniPlayer();
      });
    }
    function setMediaSessionMeta() {
      if (!('mediaSession' in navigator)) return;
      const t = player.queue[player.index];
      if (!t) return;
      const ch = findChannel(t.weekKey, t.chId) || {};
      const wData = SITE_DATA.weeks[t.weekKey] || {};
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: t.title || ch.name || 'TubeLM',
          artist: 'TubeLM · ' + (ch.category || t.category || ''),
          album: 'Week of ' + (wData.run_date || ''),
          artwork: [
            { src: 'icon-512.png', sizes: '512x512', type: 'image/png' },
            { src: 'icon-192.png', sizes: '192x192', type: 'image/png' }
          ]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch (_) {}
    }
    function updatePositionState() {
      if (!('mediaSession' in navigator)) return;
      try {
        const d = globalAudio.duration;
        if (!isFinite(d) || !d) return;
        navigator.mediaSession.setPositionState({
          duration: d,
          playbackRate: globalAudio.playbackRate || 1,
          position: Math.min(globalAudio.currentTime || 0, d)
        });
      } catch (_) {}
    }

    // Audio Controller Helpers
    const globalAudio = document.getElementById('global-audio-element');
    let currentAudioSrc = '';

    let lastAudioProgressAt = 0;
    function toggleAudio(src, btn) {
      if (currentAudioSrc !== src) {
        currentAudioSrc = src;
        globalAudio.src = src;
        globalAudio.addEventListener('loadedmetadata', function once() {
          globalAudio.removeEventListener('loadedmetadata', once);
          try {
            const saved = parseFloat(localStorage.getItem('tubelm_pos:' + src) || '0');
            if (saved > 0 && saved < (globalAudio.duration || Infinity)) globalAudio.currentTime = saved;
          } catch (_) {}
          globalAudio.play().catch(() => {});
        });
        globalAudio.load();
        isAudioPlaying = true;
      } else {
        if (globalAudio.paused) {
          globalAudio.play().catch(() => {});
          isAudioPlaying = true;
        } else {
          globalAudio.pause();
          isAudioPlaying = false;
        }
      }
      updatePlayIcon();
    }

    function updatePlayIcon() {
      const icon = document.getElementById('play-icon');
      if (!icon) return;
      const activeCh = (SITE_DATA.weeks[currentWeekKey]?.channels || []).find(c => c.id === selectedItemId);
      const matchesCurrent = activeCh && activeCh.audio_url && activeCh.audio_url === currentAudioSrc;
      if (isAudioPlaying && matchesCurrent) {
        icon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
      } else {
        icon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
      }
    }

    globalAudio.addEventListener('timeupdate', () => {
      lastAudioProgressAt = performance.now();
      try { localStorage.setItem('tubelm_pos:' + currentAudioSrc, String(globalAudio.currentTime)); } catch (_) {}
      try {
        const d = globalAudio.duration;
        if (currentAudioSrc && d && isFinite(d) && d > 0 && !isHeard(currentAudioSrc) &&
            globalAudio.currentTime / d >= 0.9) {
          markHeard(currentAudioSrc);
        }
      } catch (_) {}
      updateMiniPlayer();
      if (document.querySelector('[data-audio-src]')?.dataset.audioSrc !== currentAudioSrc && !document.getElementById('audio-progress-bar')) return;
      const cur = document.getElementById('audio-time-current');
      const dur = document.getElementById('audio-time-duration');
      const bar = document.getElementById('audio-progress-bar');
      if (cur) cur.textContent = formatTime(globalAudio.currentTime);
      if (dur && !isNaN(globalAudio.duration)) dur.textContent = formatTime(globalAudio.duration);
      if (bar && !isNaN(globalAudio.duration) && globalAudio.duration > 0) {
        bar.style.width = `${(globalAudio.currentTime / globalAudio.duration) * 100}%`;
      }
    });

    globalAudio.onended = () => {
      if (player.queue.length > 0 && player.index >= 0) { queueNext(); return; }
      isAudioPlaying = false;
      updatePlayIcon();
      updateMiniPlayer();
    };
    globalAudio.addEventListener('seeked', updatePositionState);
    globalAudio.addEventListener('ratechange', updatePositionState);
    globalAudio.addEventListener('playing', updatePositionState);
    setInterval(() => {
      if (isAudioPlaying && !globalAudio.paused) updatePositionState();
    }, 5000);

    // Resilient Audio Stream Event Handlers
    let isAudioRecovering = false;

    function setAudioBuffering(isBuffering) {
      const dot = document.querySelector('.audio-pulse-dot');
      if (dot) {
        if (isBuffering) {
          dot.classList.add('animate-spin');
          dot.style.opacity = '0.5';
        } else {
          dot.classList.remove('animate-spin');
          dot.style.opacity = '1';
        }
      }
    }

    globalAudio.addEventListener('waiting', () => setAudioBuffering(true));
    globalAudio.addEventListener('playing', () => { setAudioBuffering(false); isAudioRecovering = false; });
    globalAudio.addEventListener('error', () => { if (isAudioPlaying) tryRecoverAudio(); });
    setInterval(() => {
      if (!isAudioPlaying || globalAudio.paused || isAudioRecovering) return;
      if (performance.now() - lastAudioProgressAt > 12000 && globalAudio.readyState < 3) tryRecoverAudio();
    }, 3000);

    function tryRecoverAudio() {
      if (!currentAudioSrc || isAudioRecovering) return;
      isAudioRecovering = true;
      const resumeAt = globalAudio.currentTime || 0;
      const src = currentAudioSrc;
      globalAudio.addEventListener('loadedmetadata', function once() {
        globalAudio.removeEventListener('loadedmetadata', once);
        if (resumeAt > 0 && resumeAt < globalAudio.duration) globalAudio.currentTime = resumeAt;
        globalAudio.play().catch(() => {}).finally(() => { isAudioRecovering = false; });
      });
      globalAudio.src = src + (src.includes('?') ? '&' : '?') + 'r=' + Date.now();
      globalAudio.load();
    }

    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function seekAudio(e) {
      if (!isNaN(globalAudio.duration) && globalAudio.duration > 0) {
        const rect = e.currentTarget.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        globalAudio.currentTime = pos * globalAudio.duration;
      }
    }

    function cycleAudioSpeed(btn) {
      const speeds = [1.0, 1.25, 1.5, 1.75, 2.0];
      const cur = globalAudio.playbackRate || 1.0;
      const next = speeds[(speeds.indexOf(cur) + 1) % speeds.length];
      globalAudio.playbackRate = next;
      player.speed = next;
      savePlayer();
      btn.textContent = `${next}x`;
      const miniSpeed = document.getElementById('mini-speed');
      if (miniSpeed) miniSpeed.textContent = `${next}x`;
      updatePositionState();
    }

    // Video Player & Fullscreen Controller Helpers
    function escapeQuotes(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    let activePlayerWrapper = null;
    function unmountPlayer(wrapper) {
      if (!wrapper || !wrapper.dataset.facade) return;
      wrapper.innerHTML = wrapper.dataset.facade;
    }
    function toggleVideoPlayer(wrapperId, videoId, title) {
      const wrapper = document.getElementById(wrapperId);
      if (!wrapper) return;
      if (isAudioPlaying && globalAudio && !globalAudio.paused) {
        globalAudio.pause();
        isAudioPlaying = false;
        updatePlayIcon();
      }
      if (activePlayerWrapper && activePlayerWrapper !== wrapper) unmountPlayer(activePlayerWrapper);
      if (!wrapper.querySelector('iframe')) {
        wrapper.dataset.facade = wrapper.innerHTML;
        wrapper.innerHTML = `
          <iframe
            src="https://www.youtube-nocookie.com/embed/${videoId}?playsinline=1&rel=0"
            title="${esc(title)}"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
            allowfullscreen
            class="video-player-iframe"
          ></iframe>
        `;
        activePlayerWrapper = wrapper;
      }
    }

    function fullscreenVideoPlayer(wrapperId, videoId, title) {
      toggleVideoPlayer(wrapperId, videoId, title);
      const wrapper = document.getElementById(wrapperId);
      if (!wrapper) return;

      if (wrapper.requestFullscreen) {
        wrapper.requestFullscreen().catch(() => {});
      } else if (wrapper.webkitRequestFullscreen) {
        wrapper.webkitRequestFullscreen();
      } else if (wrapper.mozRequestFullScreen) {
        wrapper.mozRequestFullScreen();
      } else if (wrapper.msRequestFullscreen) {
        wrapper.msRequestFullscreen();
      }
    }

    // Modal Video Theater for Editorial Picks
    function openVideoModal(videoId, title) {
      if (isAudioPlaying && globalAudio && !globalAudio.paused) {
        globalAudio.pause();
        isAudioPlaying = false;
        updatePlayIcon();
      }

      let modal = document.getElementById('video-theater-modal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'video-theater-modal';
        modal.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4';
        modal.onclick = (e) => {
          if (e.target === modal) closeVideoModal();
        };
        document.body.appendChild(modal);
      }

      modal.innerHTML = `
        <div class="relative w-full max-w-4xl bg-[#11120f] border border-[var(--border-color)] rounded-xl overflow-hidden shadow-2xl" onclick="event.stopPropagation()">
          <div class="flex items-center justify-between px-4 py-3 border-b border-[var(--border-color)] bg-[#171815]">
            <h4 class="text-sm font-bold text-white truncate max-w-[75%]">${esc(title)}</h4>
            <div class="flex items-center gap-2">
              <a href="https://www.youtube.com/watch?v=${esc(videoId)}" target="_blank" rel="noopener" class="btn-fullscreen" title="Open in YouTube">Open in YouTube ↗</a>
              <button onclick="requestModalFullscreen()" class="btn-fullscreen" title="Full Screen">Full Screen ⛶</button>
              <button onclick="closeVideoModal()" class="text-gray-400 hover:text-white px-2 py-1 text-sm font-bold" title="Close">✕</button>
            </div>
          </div>
          <div id="modal-player-container" class="relative w-full aspect-video bg-black">
            <iframe
              src="https://www.youtube-nocookie.com/embed/${videoId}?playsinline=1&rel=0"
              title="${esc(title)}"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
              allowfullscreen
              class="w-full h-full border-0"
            ></iframe>
          </div>
        </div>
      `;
      modal.style.display = 'flex';
    }

    function closeVideoModal() {
      const modal = document.getElementById('video-theater-modal');
      if (modal) {
        modal.innerHTML = '';
        modal.style.display = 'none';
      }
      activePlayerWrapper = null;
    }

    function requestModalFullscreen() {
      const container = document.getElementById('modal-player-container');
      if (!container) return;
      if (container.requestFullscreen) {
        container.requestFullscreen().catch(() => {});
      } else if (container.webkitRequestFullscreen) {
        container.webkitRequestFullscreen();
      }
    }

    function toggleTheme() {
      const current = document.documentElement.dataset.theme || 'dark';
      const next = current === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = next;
      try {
        localStorage.setItem('tubelm-theme', next);
      } catch (_) {}
      updateThemeIcons(next);
    }

    // Commute font-size stepper: small 13px / medium 15px / large 17px
    const FONT_SIZES = ['small', 'medium', 'large'];
    function applyFontSize(level) {
      const idx = FONT_SIZES.indexOf(level);
      const resolved = idx >= 0 ? FONT_SIZES[idx] : 'medium';
      document.documentElement.dataset.font = resolved;
      try { localStorage.setItem('tubelm_font_size', resolved); } catch (_) {}
      const btn = document.getElementById('btn-font-size');
      if (btn) btn.textContent = resolved === 'small' ? 'Aa' : (resolved === 'large' ? 'AA' : 'Aa+');
    }
    function cycleFontSize() {
      const cur = FONT_SIZES.indexOf(document.documentElement.dataset.font || 'medium');
      applyFontSize(FONT_SIZES[(cur + 1) % FONT_SIZES.length]);
    }
    function restoreFontSize() {
      let saved = null;
      try { saved = localStorage.getItem('tubelm_font_size'); } catch (_) {}
      applyFontSize(FONT_SIZES.includes(saved) ? saved : 'medium');
    }

    function updateThemeIcons(theme) {
      const sun = document.getElementById('theme-icon-sun');
      const moon = document.getElementById('theme-icon-moon');
      if (sun && moon) {
        if (theme === 'light') {
          sun.classList.remove('hidden');
          moon.classList.add('hidden');
        } else {
          sun.classList.add('hidden');
          moon.classList.remove('hidden');
        }
      }
    }

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('filter-search').focus();
      } else if (e.key === 'Escape') {
        closeVideoModal();
        document.getElementById('filter-search').value = '';
        applyFilters();
      }
    });

    // Initial Render
    function initApp() {
      updateThemeIcons(document.documentElement.dataset.theme || 'light');
      restoreFontSize();
      loadPlayer();
      setupMediaSessionHandlers();
      updateBriefButton();
      renderSidebar();
      selectTop20();
      if (window.innerWidth < 768) {
        showSidebarMobile();
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
