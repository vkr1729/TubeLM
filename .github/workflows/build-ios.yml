name: Build TubeLM iOS (LiveContainer)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ipa:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* 2>/dev/null || true
          
          # Prioritize Xcode installation with installed iPhoneSimulator platform
          SELECTED=""
          for xcode_path in /Applications/Xcode.app /Applications/Xcode_16.2.app /Applications/Xcode_16.1.app /Applications/Xcode_16.app; do
            if [ -d "$xcode_path/Contents/Developer/Platforms/iPhoneSimulator.platform" ]; then
              echo "Found Xcode with iPhoneSimulator platform: $xcode_path"
              SELECTED="$xcode_path"
              break
            fi
          done
          
          if [ -n "$SELECTED" ]; then
            sudo xcode-select -s "$SELECTED/Contents/Developer"
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          
          xcodebuild -version
          swift --version
          xcrun --sdk iphonesimulator --show-sdk-path || true
          xcrun --sdk iphoneos --show-sdk-path || true

      - name: Test TubeLM Core
        run: |
          cd ios
          swift test --filter TubeLMCoreTests

      - name: Run Automated Simulator UAT
        run: |
          echo "=== Step 1: Discover and Boot iOS Simulator ==="
          xcrun simctl list devices available
          
          # Prioritize iPhone 16, then iPhone 15, then any available iPhone
          UDID=$(xcrun simctl list devices available | grep -i "iPhone 16" | grep -E -o '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -n 1 || true)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -i "iPhone 15" | grep -E -o '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -n 1 || true)
          fi
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -i "iPhone" | grep -E -o '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -n 1 || true)
          fi
          
          if [ -z "$UDID" ]; then
            echo "::error::No available iOS Simulator found on runner"
            exit 1
          fi
          
          echo "Selected iOS Simulator UDID: $UDID"
          echo "Booting simulator..."
          xcrun simctl boot "$UDID" || true
          
          # Wait up to 60s for simulator to reach Booted status
          for i in {1..30}; do
            STATUS=$(xcrun simctl list devices | grep "$UDID" | grep -o "(Booted)" || true)
            if [ "$STATUS" = "(Booted)" ]; then
              echo "Simulator reached Booted state in approx $((i * 2))s"
              break
            fi
            sleep 2
          done

          echo "=== Step 2: Execute Automated UAT Test Suite on iOS Simulator ==="
          cd ios
          export MOCK_DATA_PATH="$GITHUB_WORKSPACE/.workflow/mocks/mock_data.json"
          
          echo "Available schemes in Swift Package:"
          xcodebuild -list || true
          
          # Run xcodebuild test targeting the booted iOS Simulator
          echo "Executing test suite on iOS Simulator destination id=$UDID..."
          if xcodebuild test -scheme TubeLM-Package -destination "platform=iOS Simulator,id=$UDID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""; then
            echo "UAT simulator test suite passed on TubeLM-Package!"
          elif xcodebuild test -scheme TubeLMCore -destination "platform=iOS Simulator,id=$UDID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""; then
            echo "UAT simulator test suite passed on TubeLMCore!"
          elif xcodebuild test -scheme TubeLM-Package -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""; then
            echo "UAT simulator test suite passed with id destination!"
          else
            echo "::error::Automated iOS Simulator UAT tests failed"
            exit 1
          fi

          echo "=== Step 3: Install & Launch TubeLM on iOS Simulator (Live Sanity) ==="
          mkdir -p ../build/artifacts
          SIM_SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          echo "iOS Simulator SDK path: $SIM_SDK_PATH"
          
          if swift build -c debug --triple arm64-apple-ios-simulator --sdk "$SIM_SDK_PATH" 2>/dev/null || \
             swift build -c debug --triple arm64-apple-ios17.0-simulator --sdk "$SIM_SDK_PATH" 2>/dev/null || \
             swift build -c debug -Xswiftc -sdk -Xswiftc "$SIM_SDK_PATH" -Xswiftc -target -Xswiftc arm64-apple-ios17.0-simulator; then
            mkdir -p ../build/Simulator/TubeLM.app
            cp TubeLM/Info.plist ../build/Simulator/TubeLM.app/Info.plist
            cp TubeLM/AppIcon*.png ../build/Simulator/TubeLM.app/ 2>/dev/null || true
            cp ../.workflow/mocks/mock_data.json ../build/Simulator/TubeLM.app/data.json
            SIM_BIN=$(find .build -name TubeLMApp -type f -perm +111 2>/dev/null | grep -E 'simulator.*/debug/TubeLMApp' | head -n 1 || find .build -name TubeLMApp -type f 2>/dev/null | head -n 1 || true)
            if [ -n "$SIM_BIN" ] && [ -f "$SIM_BIN" ]; then
              echo "Found simulator binary: $SIM_BIN"
              cp "$SIM_BIN" ../build/Simulator/TubeLM.app/TubeLM
              chmod +x ../build/Simulator/TubeLM.app/TubeLM
              codesign -s - --force --deep ../build/Simulator/TubeLM.app || true
              echo "Installing app bundle onto simulator..."
              xcrun simctl install "$UDID" ../build/Simulator/TubeLM.app || true
              echo "Launching app on simulator..."
              xcrun simctl launch "$UDID" com.vkr1729.tubelm || true
              sleep 6
              echo "Capturing simulator screenshot..."
              xcrun simctl io "$UDID" screenshot ../build/artifacts/simulator_uat_screenshot.png || true
            fi
          else
            echo "Simulator app build skipped; unit/UAT tests already passed."
          fi
          
          echo "=== Automated Simulator UAT Step Complete ==="

      - name: Build TubeLM App for iOS
        run: |
          cd ios
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iOS SDK path: $SDK_PATH"
          if swift build -c release --triple arm64-apple-ios --sdk "$SDK_PATH"; then
            echo "Successfully built for arm64-apple-ios with --triple"
          elif swift build -c release -Xswiftc -sdk -Xswiftc "$SDK_PATH" -Xswiftc -target -Xswiftc arm64-apple-ios17.0; then
            echo "Successfully built for arm64-apple-ios with -Xswiftc flags"
          else
            echo "Falling back to swift build -c release"
            swift build -c release
          fi

      - name: Package LiveContainer IPA
        run: |
          mkdir -p build/Payload
          APP_DIR="build/Payload/TubeLM.app"
          mkdir -p "$APP_DIR"
          
          echo "Locating built TubeLMApp binary..."
          find ios/.build -name TubeLMApp -type f || true
          
          BIN_PATH=$(find ios/.build -name TubeLMApp -type f -perm +111 2>/dev/null | grep -E 'arm64-apple-ios.*/release/TubeLMApp' | head -n 1 || true)
          if [ -z "$BIN_PATH" ]; then
            BIN_PATH=$(find ios/.build -name TubeLMApp -type f -perm +111 2>/dev/null | grep -E 'release/TubeLMApp' | head -n 1 || true)
          fi
          if [ -z "$BIN_PATH" ]; then
            BIN_PATH=$(find ios/.build -name TubeLMApp -type f 2>/dev/null | head -n 1 || true)
          fi
          
          if [ -z "$BIN_PATH" ] || [ ! -f "$BIN_PATH" ]; then
            echo "::error::TubeLMApp binary not found - refusing to ship an empty IPA"
            exit 1
          fi
          
          echo "Selected binary: $BIN_PATH"
          file "$BIN_PATH"
          cp "$BIN_PATH" "$APP_DIR/TubeLM"
          chmod +x "$APP_DIR/TubeLM"

          # Execute unified packaging script with icon staging, ad-hoc codesigning & validation
          chmod +x scripts/package_ipa.sh
          ./scripts/package_ipa.sh "$APP_DIR" "build/TubeLM.ipa"

      - name: Commit and Push IPA to dist_ios
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist_ios
          cp build/TubeLM.ipa dist_ios/TubeLM.ipa
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add dist_ios/TubeLM.ipa
          git commit -m "chore(build): update dist_ios/TubeLM.ipa [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push failed or nothing to push"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TubeLM-LiveContainer-IPA
          path: build/TubeLM.ipa

      - name: Upload Simulator UAT Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TubeLM-Simulator-UAT
          path: build/artifacts/
          if-no-files-found: ignore
