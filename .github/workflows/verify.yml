name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r desktop/requirements-dev.txt

      - name: Compile
        run: python -m compileall -q desktop

      - name: Lint (ruff)
        run: ruff check desktop

      - name: Worker syntax
        run: node --check worker/worker.js

      - name: Test
        env:
          PYTHONPATH: desktop
        run: pytest desktop/tests -q
